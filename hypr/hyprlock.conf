source = ~/.config/hypr/hyprlock-colors.conf

$font = Space Grotesk, JetBrainsMono Nerd Font, sans-serif

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = breathing, 0.4, 0.0, 0.2, 1.0
    bezier = morning_mist, 0.5, 0.0, 0.0, 1.0
    animation = fade, 1, 6, breathing
    animation = inputField, 1, 4, morning_mist
    animation = inputFieldDots, 1, 3, breathing
}

background {
    monitor =
    path = /home/facuud2/.config/hypr/current_wallpaper.png
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

label {
    monitor =
    text = cmd[update:1000] /home/facuud2/.config/hypr/scripts/song_status.sh
    color = $tertiary_d0
    font_size = 16
    font_family = $font
    position = 0, -35
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:0:1] /home/facuud2/.config/hypr/scripts/lock_fortune.sh
    color = $contrary_d0
    font_size = 14
    font_family = $font
    text_align = left
    position = 45, 45
    halign = left
    valign = bottom
}

label {
    monitor =
    text = <span font_weight="medium">$TIME</span>
    color = $primary
    font_size = 86
    font_family = $font

    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:43200000] env LC_TIME=C date +"%A, %d %B"
    color = $primary
    font_size = 20
    font_family = $font
    position = 0, 85
    halign = center
    valign = center
}

shape {
    monitor =
    size = 104, 104
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = $primary_80
    position = 0, -15
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/facuud2/.config/hypr/avatar.jpg
    size = 90
    rounding = -1
    border_size = 2
    border_color = $primary
    position = 0, -15
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 230, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary $tertiary $contrary 45deg
    inner_color = $surface_container_b3
    font_color = $on_surface
    fade_on_empty = false
    font_family = $font
    placeholder_text = <i><span foreground="$outline_pango" font_size="10pt">Enter Password</span></i>
    hide_input = false

    fail_color = $error $error_container 40deg
    fail_text = <i>$PAMFAIL</i>

    position = 0, -95
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $on_surface_variant
    font_size = 14
    position = 0, -145
    halign = center
    valign = center
}

shape {
    monitor =
    size = 140%, 7%
    color = $primary_4d
    rounding = 0
    border_size = 0
    rotate = 45
    zindex = -1
    position = 68%, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 140%, 5.5%
    color = $tertiary_4d
    rounding = 0
    border_size = 0
    rotate = 45
    zindex = -1
    position = 76%, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 140%, 4.5%
    color = $contrary_4d
    rounding = 0
    border_size = 0
    rotate = 45
    zindex = -1
    position = 83%, 0
    halign = center
    valign = center
}
