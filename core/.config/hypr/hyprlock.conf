# ==============================================================================
# 🌙 Lunita-Dots macOS / iOS Aesthetic Hyprlock Configuration
# Pure clean rendering with SF Pro typography, glassmorphism, and dynamic media
# ==============================================================================

source = ~/.config/hypr/hyprlock-colors.conf

$font = SF Pro Display, Space Grotesk, JetBrainsMono Nerd Font, sans-serif
$mono_font = JetBrainsMono Nerd Font Propo, SF Mono, monospace

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = apple_ease, 0.25, 1.0, 0.5, 1.0
    bezier = gentle, 0.4, 0.0, 0.2, 1.0
    animation = fade, 1, 4, apple_ease
    animation = inputField, 1, 3, gentle
    animation = inputFieldDots, 1, 2, apple_ease
}

# ------------------------------------------------------------------------------
# 🖼️ Background: Wallpaper with subtle atmospheric depth & glass vibrancy
# ------------------------------------------------------------------------------
background {
    monitor =
    path = ~/.config/hypr/current_wallpaper.png
    blur_passes = 2
    blur_size = 5
    noise = 0.012
    contrast = 0.95
    brightness = 0.85
    vibrancy = 0.22
    vibrancy_darkness = 0.0
}

# ------------------------------------------------------------------------------
# 📶 Top Status Bar (Network: Wi-Fi/Ethernet & Bluetooth)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/lock_status.sh
    color = rgba(255, 255, 255, 0.92)
    font_size = 14
    font_family = $mono_font
    position = -30, -30
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ------------------------------------------------------------------------------
# 📅 Date (e.g. "vie 15 may" / "sáb 26 sep")
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock_date.sh
    color = rgba(245, 248, 255, 0.90)
    font_size = 22
    font_family = $font
    font_weight = medium
    position = 0, 205
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.45)
}

# ------------------------------------------------------------------------------
# ⏰ Clock (Large, bold Apple SF Pro Display typography)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.98)
    font_size = 94
    font_family = $font
    font_weight = bold
    position = 0, 125
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.40)
}

# ------------------------------------------------------------------------------
# 🎵 Media Player: Frosted Glass Container Card
# ------------------------------------------------------------------------------
shape {
    monitor =
    size = 420, 108
    color = rgba(16, 20, 30, 0.72)
    rounding = 24
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)
    shadow_passes = 3
    shadow_size = 16
    shadow_color = rgba(0, 0, 0, 0.50)
    shadow_boost = 1.2
    position = 0, -10
    halign = center
    valign = center
    zindex = 1
}

# 🎵 Media Player: Album Artwork Thumbnail
image {
    monitor =
    path = /tmp/hyprlock_art.png
    size = 78
    rounding = 14
    border_size = 1
    border_color = rgba(255, 255, 255, 0.15)
    position = -142, -10
    halign = center
    valign = center
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/lock_media.sh art
    zindex = 2
}

# 🎵 Media Player: Song Title
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock_media.sh title
    color = rgba(255, 255, 255, 0.98)
    font_size = 14
    font_family = $font
    font_weight = bold
    text_align = left
    position = 44, 14
    halign = center
    valign = center
    zindex = 2
}

# 🎵 Media Player: Artist
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock_media.sh artist
    color = rgba(255, 255, 255, 0.65)
    font_size = 12
    font_family = $font
    text_align = left
    position = 44, -10
    halign = center
    valign = center
    zindex = 2
}

# 🎵 Media Player: Controls & Playback Slider
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/lock_media.sh controls
    color = rgba(255, 255, 255, 0.88)
    font_size = 12
    font_family = $mono_font
    text_align = left
    position = 44, -34
    halign = center
    valign = center
    zindex = 2
}

# ------------------------------------------------------------------------------
# 🔒 Touch ID or Enter Password Subtitle Hint
# ------------------------------------------------------------------------------
label {
    monitor =
    text = Touch ID or Enter Password
    color = rgba(255, 255, 255, 0.60)
    font_size = 12
    font_family = $font
    position = 0, -96
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ------------------------------------------------------------------------------
# 🔑 Password Input Field (Sleek Frosted Glass Pill)
# ------------------------------------------------------------------------------
input-field {
    monitor =
    size = 250, 42
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(255, 255, 255, 0.22)
    inner_color = rgba(18, 24, 38, 0.55)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    font_family = $font
    placeholder_text = Enter Password
    hide_input = false

    check_color = rgba(0, 122, 255, 0.8)
    fail_color = rgba(255, 59, 48, 0.85)
    fail_text = $PAMFAIL
    capslock_color = rgba(255, 159, 10, 0.85)

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)

    position = 0, -142
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# 🌐 Keyboard Layout Indicator
# ------------------------------------------------------------------------------
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.40)
    font_size = 10
    font_family = $font
    position = 0, -182
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# 🍎 macOS Style Bottom Power Options
# ------------------------------------------------------------------------------
label {
    monitor =
    text = 󰤄  Suspender        󰑓  Reiniciar        󰐥  Apagar
    color = rgba(255, 255, 255, 0.60)
    font_size = 12
    font_family = $font
    position = 0, 45
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
}
