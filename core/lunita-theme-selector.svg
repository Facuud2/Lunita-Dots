<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e2e"/>
      <stop offset="50%" stop-color="#18141d"/>
      <stop offset="100%" stop-color="#0e0b12"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecdcff"/>
      <stop offset="100%" stop-color="#d5bbfc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1b7c3"/>
      <stop offset="100%" stop-color="#d5bbfc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#37333a" stroke-width="2"/>
  <rect x="9" y="9" width="110" height="110" rx="27" fill="none" stroke="#d5bbfc" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Glowing background aura -->
  <circle cx="56" cy="62" r="32" fill="#d5bbfc" fill-opacity="0.12" filter="url(#glow)"/>

  <!-- Lunita Moon -->
  <path d="M72 32 A34 34 0 1 0 76 94 A32 32 0 0 1 72 32 Z" fill="url(#moonGrad)" filter="url(#glow)"/>

  <!-- Theme Palette Swatches / Dots -->
  <circle cx="86" cy="40" r="9" fill="#d5bbfc" stroke="#151218" stroke-width="2.5"/>
  <circle cx="98" cy="58" r="9" fill="#f1b7c3" stroke="#151218" stroke-width="2.5"/>
  <circle cx="92" cy="78" r="9" fill="#81c784" stroke="#151218" stroke-width="2.5"/>

  <!-- Sparkle stars -->
  <path d="M42 36 L44 42 L50 44 L44 46 L42 52 L40 46 L34 44 L40 42 Z" fill="#ecdcff" opacity="0.9"/>
  <path d="M30 76 L31.5 80 L35.5 81.5 L31.5 83 L30 87 L28.5 83 L24.5 81.5 L28.5 80 Z" fill="#f1b7c3" opacity="0.8"/>
</svg>
