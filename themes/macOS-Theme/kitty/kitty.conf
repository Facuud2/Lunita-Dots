# Kitty Configuration
# Pair programmed for Hyprland + Matugen-bin + Neovim integration

# --- Fonts ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures yes

# --- Bell & Audio ---
enable_audio_bell no

# --- Shell Integration ---
shell_integration disabled

# --- Cursor ---
cursor_shape         beam 
cursor_blink_interval 0
cursor_trail          3
cursor_trail_decay    0.1 0.4
cursor_trail_start_threshold 2

# --- Window & Appearance ---
remember_window_size  no
window_padding_width  25
confirm_os_window_close 0
url_style             curly

# --- Transparency & Blurring ---
# Calibrated for Hyprland active_opacity (0.88) & blur
background_opacity    0.85
dynamic_background_opacity yes

# --- Scrollbar ---
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

# --- Performance & Latency ---
sync_to_monitor no
repaint_delay   8
input_delay     3

# --- macOS 27 Color Palette ---
include colors-macos.conf
