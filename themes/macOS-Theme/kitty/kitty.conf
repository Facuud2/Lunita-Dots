# ==============================================================================
# 🍎 macOS Sonoma / Sequoia Kitty Terminal Configuration
# Authentic macOS Typography, Window Decorations, and Muscle Memory Shortcuts
# ==============================================================================

# --- Typography & Fonts ---
# Official Apple Monospace Font
font_family      SF Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures yes

# Nerd Fonts Glyphs Fallback (JetBrainsMono Nerd Font)
symbol_map U+E000-U+E00A,U+EA60-U+EBEB,U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+ED00-U+EFC1,U+F000-U+F2FF,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F533,U+F0001-U+F1AF0 JetBrainsMono Nerd Font

# --- Bell & Alerts ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# --- Shell Integration ---
shell_integration enabled

# --- Cursor (Apple macOS Block with Smooth Blinking) ---
cursor_shape               block
cursor_blink_interval       0.5
cursor_stop_blinking_after 15.0
cursor_trail               0

# --- Window & Appearance ---
remember_window_size    no
initial_window_width    105c
initial_window_height   30c
window_padding_width    14 18
confirm_os_window_close 0
url_style               curly

# --- macOS Window Header & Tab Bar ---
tab_bar_edge            top
tab_bar_style           custom
tab_bar_min_tabs        1
tab_bar_margin_width    6
tab_bar_margin_height   7 3
tab_bar_align           left
active_tab_font_style   normal
inactive_tab_font_style normal
tab_title_template      "{title}"
active_tab_title_template "{title}"

# --- Translucency & Frosted Glass ---
background_opacity         0.88
dynamic_background_opacity yes

# --- Scrollbar ---
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

# --- Performance & Latency ---
sync_to_monitor yes
repaint_delay   8
input_delay     2

# --- macOS Keybindings & Shortcuts ---
# Clipboard
map super+c            copy_to_clipboard
map super+v            paste_from_clipboard
map ctrl+shift+c       copy_to_clipboard
map ctrl+shift+v       paste_from_clipboard
copy_on_select         yes

# Window & Tabs (Cmd+T, Cmd+W, Cmd+Q)
map super+t            new_tab
map super+w            close_tab
map super+q            quit

# Clear Screen (macOS Cmd+K)
map super+k            combine : clear_terminal active : send_text normal,application \x0c

# Zoom / Font size (Cmd+, Cmd-, Cmd 0)
map super+equal        change_font_size all +1.0
map super+plus         change_font_size all +1.0
map super+minus        change_font_size all -1.0
map super+0            change_font_size all 0

# macOS Navigation Shortcuts (Option+Arrow for word skip, Cmd+Arrow for line extremes)
map alt+left           send_text all \x1bb
map alt+right          send_text all \x1bf
map super+left         send_text all \x01
map super+right        send_text all \x05
map alt+backspace      send_text all \x17
map super+backspace    send_text all \x15

# Tabs Navigation (Cmd+1..9, Cmd+Shift+[, Cmd+Shift+])
map super+1            goto_tab 1
map super+2            goto_tab 2
map super+3            goto_tab 3
map super+4            goto_tab 4
map super+5            goto_tab 5
map super+6            goto_tab 6
map super+7            goto_tab 7
map super+8            goto_tab 8
map super+9            goto_tab 9
map super+shift+[      previous_tab
map super+shift+]      next_tab

# --- Color Theme ---
include colors-macos.conf
