[config]
source_color_index = 0

[templates.eww_colors]
input_path = '~/.config/matugen/templates/eww-colors.scss'
output_path = '~/.config/eww/colors.scss'

# [templates.ags_colors]
# input_path = '~/.config/matugen/templates/ags-colors.scss'
# output_path = '~/.config/ags/colors.scss'

[templates.hyprland_colors]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/modules/colors.lua'
post_hook = '~/.config/matugen/hooks/update-theme.sh'

[templates.kitty_colors]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors-matugen.conf'

[templates.nvim_colors]
input_path = '~/.config/matugen/templates/nvim-colors.lua'
output_path = '~/.config/nvim/lua/colors.lua'

[templates.zsh_colors]
input_path = '~/.config/matugen/templates/zsh-colors.zsh'
output_path = '~/.oh-my-zsh/custom/zsh-colors.zsh'

[templates.hyprlock_colors]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.prelock_palette]
input_path = '~/.config/matugen/templates/prelock-palette.conf'
output_path = '~/.config/prelock/palette.conf'

[templates.vesktop_theme]
input_path = '~/.config/matugen/templates/vesktop-theme.css'
output_path = '~/.config/vesktop/themes/lunita.theme.css'

[templates.kdeglobals]
input_path = '~/.config/matugen/templates/kdeglobals'
output_path = '~/.config/kdeglobals'

[templates.lunita_colors]
input_path = '~/.config/matugen/templates/kdeglobals'
output_path = '~/.local/share/color-schemes/Lunita.colors'

[templates.qt6ct_colors]
input_path = '~/.config/matugen/templates/qt6ct-colors.conf'
output_path = '~/.config/qt6ct/colors/lunita.conf'

[templates.qt6ct_style]
input_path = '~/.config/matugen/templates/qt6ct-style.qss'
output_path = '~/.config/qt6ct/qss/lunita.qss'

[templates.gtk3_css]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4_css]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.wvkbd_colors]
input_path = '~/.config/matugen/templates/wvkbd-colors.sh'
output_path = '~/.config/hypr/scripts/wvkbd-colors.env'








[templates.quickshell_colors]
input_path = '~/.config/matugen/templates/quickshell-colors.json'
output_path = '~/.config/quickshell/colors.json'
