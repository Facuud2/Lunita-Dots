<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Paper Shadow -->
    <filter id="paper-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <!-- Paper Background Gradient -->
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef1f5"/>
    </linearGradient>
    <!-- Fold Gradient -->
    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d9e2"/>
      <stop offset="100%" stop-color="#b8c0cc"/>
    </linearGradient>
    <!-- Badge Gradient (Safari style small badge) -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ba8ff"/>
      <stop offset="100%" stop-color="#0060df"/>
    </linearGradient>
  </defs>

  <!-- Document Sheet -->
  <g filter="url(#paper-shadow)">
    <!-- Main page path with cut top-right corner -->
    <path d="M24 16 C24 11.58 27.58 8 32 8 L76 8 L104 36 L104 112 C104 116.42 100.42 120 96 120 L32 120 C27.58 120 24 116.42 24 112 Z" fill="url(#paper-grad)"/>
    <path d="M24 16 C24 11.58 27.58 8 32 8 L76 8 L104 36 L104 112 C104 116.42 100.42 120 96 120 L32 120 C27.58 120 24 116.42 24 112 Z" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>

    <!-- Folded Corner -->
    <path d="M76 8 L76 28 C76 32.42 79.58 36 84 36 L104 36 Z" fill="url(#fold-grad)"/>
    <path d="M76 8 L76 28 C76 32.42 79.58 36 84 36 L104 36 Z" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  </g>

  <!-- Text Preview Lines on Document -->
  <rect x="38" y="44" width="48" height="4" rx="2" fill="#9aa0ac"/>
  <rect x="38" y="56" width="52" height="4" rx="2" fill="#b0b7c3"/>
  <rect x="38" y="68" width="44" height="4" rx="2" fill="#b0b7c3"/>
  <rect x="38" y="80" width="50" height="4" rx="2" fill="#b0b7c3"/>
  <rect x="38" y="92" width="36" height="4" rx="2" fill="#b0b7c3"/>

  <!-- Small App Badge at Bottom Right -->
  <g transform="translate(86, 92)">
    <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
    <circle cx="16" cy="16" r="13" fill="url(#badge-grad)"/>
    <!-- Compass needle in badge -->
    <g transform="rotate(45 16 16)">
      <polygon points="16,6 19,16 16,16" fill="#ff453a"/>
      <polygon points="16,6 13,16 16,16" fill="#ff6961"/>
      <polygon points="16,26 19,16 16,16" fill="#ffffff"/>
      <polygon points="16,26 13,16 16,16" fill="#e5e8ec"/>
      <circle cx="16" cy="16" r="1.5" fill="#ffffff"/>
    </g>
  </g>
</svg>
