<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="safari-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e4eb"/>
    </linearGradient>
    <linearGradient id="dial-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ba8ff"/>
      <stop offset="50%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0060df"/>
    </linearGradient>
    <linearGradient id="needle-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a"/>
      <stop offset="100%" stop-color="#d70015"/>
    </linearGradient>
    <linearGradient id="needle-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd0d8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#safari-bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
  <!-- Compass Inner Disc -->
  <circle cx="64" cy="64" r="46" fill="url(#dial-bg)"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Compass Ticks & Ring -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2 6"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.75"/>
  <!-- Needle -->
  <g transform="rotate(45 64 64)">
    <polygon points="64,18 72,64 64,64" fill="url(#needle-red)"/>
    <polygon points="64,18 56,64 64,64" fill="#ff6961"/>
    <polygon points="64,110 72,64 64,64" fill="url(#needle-white)"/>
    <polygon points="64,110 56,64 64,64" fill="#e5e8ec"/>
    <circle cx="64" cy="64" r="4" fill="#ffffff"/>
    <circle cx="64" cy="64" r="1.5" fill="#0060df"/>
  </g>
</svg>
