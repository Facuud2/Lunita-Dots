<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="add-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3f4d"/>
      <stop offset="50%" stop-color="#2c303c"/>
      <stop offset="100%" stop-color="#1e2129"/>
    </linearGradient>
    <linearGradient id="plus-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0d6e2"/>
    </linearGradient>
    <linearGradient id="circle-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#add-bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Inner Subtle Accent Circle -->
  <circle cx="64" cy="64" r="34" fill="url(#circle-inner)" filter="url(#shadow)"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>

  <!-- Clean Plus Symbol -->
  <path d="M64 45 C65.6569 45 67 46.3431 67 48 V61 H80 C81.6569 61 83 62.3431 83 64 C83 65.6569 81.6569 67 80 67 H67 V80 C67 81.6569 65.6569 83 64 83 C62.3431 83 61 81.6569 61 80 V67 H48 C46.3431 67 45 65.6569 45 64 C45 62.3431 46.3431 61 48 61 H61 V48 C61 46.3431 62.3431 45 64 45 Z" fill="url(#plus-grad)"/>
</svg>
