<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="trash-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd0d8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="trash-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(240, 245, 255, 0.5)"/>
      <stop offset="100%" stop-color="rgba(200, 215, 235, 0.25)"/>
    </linearGradient>
  </defs>
  <!-- Trash Can Mesh/Glass Cylinder -->
  <path d="M34 36 L40 106 C41 112 48 116 64 116 C80 116 87 112 88 106 L94 36 Z" fill="url(#trash-body)" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <!-- Vertical wire rib lines -->
  <line x1="48" y1="36" x2="52" y2="114" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="64" y1="36" x2="64" y2="116" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <line x1="80" y1="36" x2="76" y2="114" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- Top Metallic Rim -->
  <ellipse cx="64" cy="36" rx="32" ry="9" fill="url(#trash-rim)" stroke="rgba(180, 190, 205, 0.8)" stroke-width="2"/>
  <ellipse cx="64" cy="36" rx="28" ry="6" fill="#303540" opacity="0.3"/>
</svg>
