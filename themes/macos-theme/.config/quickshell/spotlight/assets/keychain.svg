<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#1c1c1e"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- 3 colored keys -->
  <g transform="translate(64,64) rotate(-35)">
    <!-- Yellow key -->
    <circle cx="-16" cy="-16" r="10" fill="none" stroke="#ffd60a" stroke-width="5"/>
    <line x1="-16" y1="-6" x2="-16" y2="28" stroke="#ffd60a" stroke-width="5" stroke-linecap="round"/>
    <!-- Cyan key -->
    <circle cx="0" cy="-20" r="10" fill="none" stroke="#32ade6" stroke-width="5"/>
    <line x1="0" y1="-10" x2="0" y2="34" stroke="#32ade6" stroke-width="5" stroke-linecap="round"/>
    <!-- Green key -->
    <circle cx="16" cy="-16" r="10" fill="none" stroke="#34c759" stroke-width="5"/>
    <line x1="16" y1="-6" x2="16" y2="28" stroke="#34c759" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
